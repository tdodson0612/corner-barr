<!-- /corner-barr/shop.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Shop handmade custom cutting boards, engraved gifts, candles, soaps, resin crafts, jewelry, gift baskets and holiday gifts from Corner Barr in Central Point, Oregon."
    >

    <title>Shop Custom Cutting Boards, Candles, Soaps &amp; Gifts | Corner Barr</title>

    <link rel="canonical" href="https://cornerbarr.com/shop.html">

    <!-- Link previews (Facebook, texts, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Corner Barr">
    <meta property="og:title" content="Shop Handmade Gifts | Corner Barr">
    <meta property="og:description" content="Shop handmade custom cutting boards, engraved gifts, candles, soaps, resin crafts, jewelry, gift baskets and holiday gifts from Corner Barr in Central Point, Oregon.">
    <meta property="og:url" content="https://cornerbarr.com/shop.html">
    <meta property="og:image" content="https://cornerbarr.com/assets/images/corner-barr-booth.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <div id="header-slot"></div>


    <main>

        <!-- =========================================
             SHOP
        ========================================== -->

        <section
            class="shop-section"
            id="shop"
        >

            <div class="shop-header">

                <p class="eyebrow">
                    THE CORNER BARR SHOP
                </p>

                <h2>
                    Something for every occasion.
                </h2>

                <p>
                    Browse our handmade collections,
                    find something special, or create
                    a personalized gift of your own.
                </p>

            </div>


            <!-- =====================================
                 SHOP CATEGORY NAVIGATION
            ====================================== -->

            <nav class="shop-category-nav" id="shopCategoryNav"></nav>



            <!-- =====================================
                 COLLECTIONS
                 Built by js/shop.js from the categories in
                 Manage Shop > Categories.
            ====================================== -->

            <section class="shop-collection" data-shop-dynamic>
                <p>Loading products…</p>
            </section>

        </section>

    </main>


    <div id="footer-slot"></div>

    <div id="cart-drawer-slot"></div>
    <div id="checkout-modal-slot"></div>
    <div id="account-modal-slot"></div>
    <div id="admin-modal-slot"></div>


    <script src="js/partials.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/shop.js"></script>

</body>

</html>
