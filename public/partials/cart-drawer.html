    <!-- =========================================
         CART DRAWER
    ========================================== -->

    <div
        class="cart-overlay"
        id="cartOverlay"
    ></div>


    <aside
        class="cart-drawer"
        id="cartDrawer"
    >

        <div class="cart-header">

            <div>

                <p class="eyebrow">
                    YOUR ORDER
                </p>

                <h2>
                    Your Cart
                </h2>

            </div>

            <button
                class="close-button"
                id="closeCart"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            class="cart-items"
            id="cartItems"
        ></div>


        <div class="cart-footer">

            <div class="cart-total">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    $0.00
                </strong>

            </div>

            <button
                class="primary-button full-width"
                id="checkoutButton"
                type="button"
            >
                Checkout
            </button>

        </div>

    </aside>
