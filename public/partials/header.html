<header class="site-header">

    <div class="header-inner">

        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-mark">
                <span>⌁</span>
            </div>

            <div>

                <div class="brand-name">
                    CORNER BARR
                </div>

                <div class="brand-tagline">
                    CUSTOM MADE GIFTS
                </div>

            </div>

        </a>


        <nav class="main-nav">

            <a href="shop.html">
                Shop
            </a>

            <a href="index.html#about">
                Our Story
            </a>

        </nav>


        <div class="header-search" id="headerSearch">

            <input
                type="search"
                id="siteSearchInput"
                class="header-search-input"
                placeholder="Search products…"
                autocomplete="off"
                aria-label="Search products"
            >

            <button
                type="button"
                id="siteSearchClear"
                class="header-search-clear hidden"
                aria-label="Clear search"
            >
                ×
            </button>

            <div
                id="siteSearchResults"
                class="header-search-results hidden"
            ></div>

        </div>


        <div class="header-actions">

            <button
                class="notification-bell-button hidden"
                id="notificationBellButton"
                type="button"
                aria-label="Notifications"
            >
                🔔
                <span class="notification-badge hidden" id="notificationBadge">0</span>
            </button>

            <div class="notification-panel" id="notificationPanel">

                <div class="notification-panel-header">
                    <span>Notifications</span>
                    <button type="button" id="markAllNotificationsRead" class="notification-mark-all">Mark all read</button>
                </div>

                <div id="notificationList" class="notification-list"></div>

            </div>

            <button
                class="account-button"
                id="accountButton"
                type="button"
            >
                Account
            </button>

            <button
                class="account-button owner-only hidden"
                id="manageShopButton"
                type="button"
            >
                Manage Shop
                <span class="notification-badge hidden" id="manageShopOrderBadge">0</span>
            </button>

            <button
                class="cart-button"
                id="cartButton"
                type="button"
            >

                <span>
                    Cart
                </span>

                <span
                    class="cart-count"
                    id="cartCount"
                >
                    0
                </span>

            </button>

        </div>

    </div>

</header>
